name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    # Repository secrets are not available to fork PRs. Do not switch this to
    # pull_request_target to work around that; fork PR contents are untrusted.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: claude-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness, regressions, security,
            reliability, and missing tests or documentation. Report only
            actionable findings, ordered by severity, and cite the exact changed
            lines. Do not modify files, push commits, or create a PR. If there
            are no actionable findings, say so briefly.
          claude_args: |
            --model claude-sonnet-5-5
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
