id = "user.omp-orchestrator"
name = "OMP Orchestrator"
version = "0.1.0"
# Semver orders any 0.9.1-preview BELOW 0.9.1, so declaring 0.9.1 cannot be
# satisfied by a 0.9.1 preview build (observed: plugin_requires_newer_herdr on
# herdr 0.9.1-preview.2026-09-21, which reports 0.9.0 for version comparison).
# Every method and hook event this plugin uses is present in that build's own
# `herdr api schema --json`: pane.move, worktree.create/remove/list,
# workspace.create, plugin.pane.open, events.subscribe/wait, session.snapshot,
# agent.start/prompt/get/read, pane.get, pane.report_agent/release_agent,
# pane.agent_status_changed and pane.moved. So the last released floor that
# matches the required feature set is the correct declaration.
min_herdr_version = "0.9.0"
platforms = ["windows"]

[[build]]
command = ["go", "build", "-o", "herdr-omp-orchestrator.exe", "./cmd/herdr-omp-orchestrator"]

# Herdr runs the startup hook once per enabled plugin after it restores the
# session and its API socket is ready (and again when a new server takes over).
# The plugin reconciles every recorded pane binding from `herdr api snapshot` and
# `worktree list`, because event hooks are one-shot and subscriptions are not
# replayed: a move or a status change that happened while the plugin was not
# running exists only in Herdr's live state.
[[startup]]
command = ["./herdr-omp-orchestrator.exe", "startup"]

# Both hook names are declared by the installed Herdr build's own
# `herdr api schema --json` (event kinds pane_agent_status_changed and
# pane_moved). A name Herdr does not know is only a link warning, which is why
# `herdr plugin list --json` warnings are inspected after linking.
[[events]]
on = "pane.agent_status_changed"
command = ["./herdr-omp-orchestrator.exe", "event"]

[[events]]
on = "pane.moved"
command = ["./herdr-omp-orchestrator.exe", "event"]

[[actions]]
id = "setup"
title = "Setup OMP orchestrator extension"
command = ["./herdr-omp-orchestrator.exe", "setup"]

[[actions]]
id = "bind"
title = "Bind this repository as an orchestrated project"
contexts = ["pane", "workspace"]
command = ["./herdr-omp-orchestrator.exe", "bind"]

# The board is read-only: it reads the task facts, derives each card's stage and
# can focus one verified worker pane. It has no dispatch, review, merge or
# cleanup command, so nothing here mutates a task.
[[panes]]
id = "board"
title = "Task board"
placement = "overlay"
command = ["./herdr-omp-orchestrator.exe", "board"]

# The action opens that pane in the bound project's workspace. The pane route
# then maps its own plugin context back to that project, so the action only has
# to name the workspace.
[[actions]]
id = "board"
title = "Open the task board"
contexts = ["pane", "workspace"]
command = ["./herdr-omp-orchestrator.exe", "open-board"]
